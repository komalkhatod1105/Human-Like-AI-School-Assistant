<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ AI School Assistant</title>
    <style>
        :root {
            --bg1: #eef7ff;
            --bg2: #f5f3ff;
            --card: rgba(255, 255, 255, 0.78);
            --card-strong: #ffffff;
            --primary: #4f46e5;
            --primary-2: #7c3aed;
            --accent: #14b8a6;
            --text: #111827;
            --muted: #6b7280;
            --line: rgba(148, 163, 184, 0.35);
            --user: linear-gradient(135deg, #dbeafe, #bfdbfe);
            --assistant: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top left, rgba(79, 70, 229, 0.12), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(20, 184, 166, 0.12), transparent 30%),
                        linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
            border-radius: 26px;
            box-shadow: 0 25px 60px rgba(79, 70, 229, 0.12);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0f172a, #1e293b 45%, #312e81);
            color: white;
            padding: 22px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-mark {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #60a5fa, #8b5cf6);
            font-size: 1.5rem;
            box-shadow: 0 12px 24px rgba(96, 165, 250, 0.35);
        }

        .header h1 {
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2.1rem);
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls select {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .controls select:hover {
            border-color: rgba(255,255,255,0.3);
        }

        .controls select option {
            color: #111827;
        }

        .main {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            min-height: 660px;
        }

        .chat-panel {
            padding: 22px 22px 18px;
            border-right: 1px solid var(--line);
            background: rgba(248, 250, 252, 0.6);
            display: flex;
            flex-direction: column;
        }

        .avatar-panel {
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, rgba(79,70,229,0.06), rgba(20,184,166,0.08));
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 18px;
        }

        .avatar {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            position: relative;
            box-shadow: 0 12px 26px rgba(79,70,229,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .avatar.listening {
            animation: pulse-ring 1.5s infinite;
        }

        .avatar.speaking {
            animation: pulse-ring 0.6s infinite;
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 12px 26px rgba(79,70,229,0.25);
            }
            50% {
                box-shadow: 0 12px 26px rgba(79,70,229,0.5), 0 0 0 10px rgba(79,70,229,0.1);
            }
            100% {
                box-shadow: 0 12px 26px rgba(79,70,229,0.25);
            }
        }

        .avatar-status {
            flex: 1;
        }

        .avatar-status small {
            color: var(--muted);
            display: block;
            margin-bottom: 3px;
        }

        .avatar-status strong {
            font-size: 1.05rem;
        }

        .online {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--success);
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16,185,129,0.2);
            border-radius: 999px;
            padding: 5px 8px;
            margin-top: 5px;
        }

        .online::before {
            content: "";
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25% { opacity: 0.3; }
        }

        .messages {
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--line);
            border-radius: 18px;
            height: 440px;
            overflow-y: auto;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: inset 0 1px 8px rgba(148,163,184,0.10);
            flex: 1;
        }

        .message {
            margin: 10px 0;
            max-width: 82%;
            padding: 12px 15px;
            border-radius: 18px;
            line-height: 1.55;
            font-size: 0.97rem;
            box-shadow: 0 8px 18px rgba(15,23,42,0.04);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: var(--user);
            margin-left: auto;
            border-bottom-right-radius: 6px;
        }

        .message.assistant {
            background: var(--assistant);
            margin-right: auto;
            border-bottom-left-radius: 6px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(148,163,184,0.45);
            font-size: 1rem;
            background: white;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-row input:focus {
            border-color: rgba(79,70,229,0.6);
            box-shadow: 0 0 0 4px rgba(79,70,229,0.12);
        }

        .input-row input:disabled {
            background: #f3f4f6;
            cursor: not-allowed;
        }

        .input-row button {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(79,70,229,0.24);
            transition: transform 0.2s ease;
            min-width: 80px;
        }

        .input-row button:hover {
            transform: translateY(-2px);
        }

        .input-row button:active {
            transform: translateY(0);
        }

        .input-row button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .sidebar {
            padding: 22px;
            background: rgba(255,255,255,0.3);
            overflow-y: auto;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel {
            background: rgba(255,255,255,0.82);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 12px 18px rgba(15, 23, 42, 0.04);
        }

        .panel h3 {
            margin: 0 0 12px;
            font-size: 1.06rem;
            font-weight: 600;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .metric {
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            border: 1px solid rgba(99, 102, 241, 0.14);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .metric small {
            color: var(--muted);
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
        }

        .metric strong {
            font-size: 1.2rem;
            display: block;
        }

        .sample {
            display: block;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
            border: 1px solid rgba(96,165,250,0.22);
            border-radius: 12px;
            padding: 10px 12px;
            margin: 10px 0;
            cursor: pointer;
            color: var(--text);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            font-size: 0.9rem;
            text-align: left;
        }

        .sample:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(59,130,246,0.08);
            border-color: rgba(96,165,250,0.4);
        }

        .interaction-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .voice-btn, .tts-btn {
            background: linear-gradient(135deg, var(--success), #0ea5a4);
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 12px 22px rgba(16, 185, 129, 0.18);
            transition: transform 0.2s ease;
            font-size: 0.95rem;
        }

        .voice-btn:hover, .tts-btn:hover {
            transform: translateY(-2px);
        }

        .voice-btn:active, .tts-btn:active {
            transform: translateY(0);
        }

        .voice-btn:disabled, .tts-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--muted);
            margin-left: 8px;
        }

        .status-indicator.idle {
            background: var(--success);
        }

        .status-indicator.listening {
            background: var(--warning);
            animation: pulse 1s infinite;
        }

        .status-indicator.processing {
            background: var(--primary);
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 760px) {
            .main {
                grid-template-columns: 1fr;
            }

            .chat-panel {
                border-right: none;
                border-bottom: 1px solid var(--line);
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .container {
                margin: 20px 12px;
                border-radius: 18px;
            }

            .sidebar {
                max-height: 400px;
                gap: 12px;
            }

            .messages {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <div class="brand-mark">🤖</div>
                <h1>XYZ AI School Assistant</h1>
            </div>
            <div class="controls">
                <select id="languageSelect" title="Select language">
                    <option value="en">🌐 English</option>
                    <option value="hi">हिन्दी</option>
                    <option value="ta">தமிழ்</option>
                    <option value="te">తెలుగు</option>
                    <option value="mr">मराठी</option>
                    <option value="bn">বাংলা</option>
                    <option value="gu">ગુજરાતી</option>
                    <option value="pa">ਪੰਜਾਬੀ</option>
                    <option value="kn">ಕನ್ನಡ</option>
                    <option value="ml">മലയാളം</option>
                    <option value="ur">اردو</option>
                </select>
                <select id="userSelect" title="Select user">
                    <option value="S001">👤 Rahul (Student)</option>
                    <option value="P001">👨‍👩‍👧 Priya (Parent)</option>
                    <option value="T001">👩‍🏫 Anita (Teacher)</option>
                    <option value="PR001">🎓 Raj (Principal)</option>
                </select>
            </div>
        </div>

        <div class="main">
            <div class="chat-panel">
                <div class="avatar-panel">
                    <div class="avatar" id="avatar">🤖</div>
                    <div class="avatar-status">
                        <small>XYZ AI</small>
                        <strong>School Support Assistant</strong>
                        <span class="online">Online<span class="status-indicator idle" id="statusIndicator"></span></span>
                    </div>
                </div>

                <div id="messages" class="messages"></div>
                <div class="input-row">
                    <input id="messageInput" type="text" placeholder="Ask about attendance, support, or teacher escalation..." />
                    <button id="sendBtn">Send</button>
                </div>
            </div>

            <aside class="sidebar">
                <div class="panel">
                    <h3>📝 Quick Samples</h3>
                    <div id="samplesContainer"></div>
                </div>

                <div class="panel">
                    <h3>📊 School Status</h3>
                    <div class="metrics">
                        <div class="metric">
                            <small>Attendance</small>
                            <strong>89.7%</strong>
                        </div>
                        <div class="metric">
                            <small>Students</small>
                            <strong>1,240</strong>
                        </div>
                        <div class="metric">
                            <small>Parents</small>
                            <strong>980</strong>
                        </div>
                        <div class="metric">
                            <small>Teachers</small>
                            <strong>68</strong>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3>🎙️ Interaction</h3>
                    <div class="interaction-buttons">
                        <button id="voiceBtn" class="voice-btn">🎤 Speak to AI</button>
                        <button id="ttsBtn" class="tts-btn" disabled>🔊 Speak Response</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = '/api';
        
        // DOM elements
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const userSelect = document.getElementById('userSelect');
        const languageSelect = document.getElementById('languageSelect');
        const voiceBtn = document.getElementById('voiceBtn');
        const ttsBtn = document.getElementById('ttsBtn');
        const avatar = document.getElementById('avatar');
        const statusIndicator = document.getElementById('statusIndicator');
        const samplesContainer = document.getElementById('samplesContainer');

        // State
        let lastAssistantMessage = '';
        let currentUserRole = '';
        let isListening = false;
        let isSpeaking = false;
        let speechRecognition = null;

        // Role-based quick samples
        const samplesByRole = {
            student: [
                'What is my attendance?',
                'Show my attendance.',
                'Am I maintaining good attendance?',
                'I want to talk to my teacher.',
            ],
            parent: [
                'How much attendance does my child have?',
                'What about last month?',
                'I want to talk to my child\'s teacher.',
                'Contact school management.',
            ],
            teacher: [
                'Mark Rahul absent today.',
                'Show Rahul\'s attendance.',
                'Which students have low attendance?',
            ],
            principal: [
                'What is the overall attendance?',
                'Which class has the lowest attendance?',
                'How many students are below 75%?',
                'Show today\'s attendance summary.',
            ],
        };

        // Utility functions
        function getCurrentUserRole() {
            const userId = userSelect.value;
            if (userId.startsWith('S')) return 'student';
            if (userId.startsWith('P')) return 'parent';
            if (userId.startsWith('T')) return 'teacher';
            if (userId.startsWith('PR')) return 'principal';
            return 'student';
        }

        function updateSamplesForRole() {
            currentUserRole = getCurrentUserRole();
            samplesContainer.innerHTML = '';
            const samples = samplesByRole[currentUserRole] || samplesByRole.student;
            samples.forEach(sample => {
                const btn = document.createElement('button');
                btn.className = 'sample';
                btn.textContent = sample;
                btn.onclick = () => sendMessage(sample);
                samplesContainer.appendChild(btn);
            });
        }

        function addMessage(text, sender = 'assistant') {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.textContent = text;
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            if (sender === 'assistant') {
                lastAssistantMessage = text;
                ttsBtn.disabled = false;
            }
        }

        function setStatusIndicator(status) {
            statusIndicator.className = `status-indicator ${status}`;
        }

        async function sendMessage(message) {
            if (!message.trim()) return;

            const userId = userSelect.value;
            const language = languageSelect.value;

            addMessage(message, 'user');
            inputEl.value = '';
            inputEl.disabled = true;
            sendBtn.disabled = true;

            setStatusIndicator('processing');
            avatar.classList.add('speaking');

            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        message: message,
                        language: language,
                    }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const responseText = data.text || 'I encountered an issue. Please try again.';
                addMessage(responseText, 'assistant');

                // Auto-play TTS if browser supports it
                const shouldAutoTTS = localStorage.getItem('autoTTS') === 'true';
                if (shouldAutoTTS && 'speechSynthesis' in window) {
                    speakText(responseText, language);
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('Sorry, I encountered an error. Please try again.', 'assistant');
            } finally {
                inputEl.disabled = false;
                sendBtn.disabled = false;
                avatar.classList.remove('speaking');
                setStatusIndicator('idle');
            }
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                voiceBtn.disabled = true;
                voiceBtn.title = 'Speech recognition not supported in this browser';
                return;
            }

            speechRecognition = new SpeechRecognition();
            speechRecognition.continuous = false;
            speechRecognition.interimResults = false;
            const language = languageSelect.value;
            speechRecognition.lang = getLanguageCode(language);

            speechRecognition.onstart = () => {
                isListening = true;
                voiceBtn.textContent = '🎤 Listening...';
                avatar.classList.add('listening');
                setStatusIndicator('listening');
            };

            speechRecognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        const message = transcript.trim();
                        if (message) {
                            sendMessage(message);
                        }
                    } else {
                        interimTranscript += transcript;
                    }
                }
            };

            speechRecognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                addMessage('Sorry, I couldn\'t understand that. Please try again.', 'assistant');
            };

            speechRecognition.onend = () => {
                isListening = false;
                voiceBtn.textContent = '🎤 Speak to AI';
                avatar.classList.remove('listening');
                setStatusIndicator('idle');
            };
        }

        function toggleVoiceInput() {
            if (!speechRecognition) {
                initSpeechRecognition();
            }

            if (isListening) {
                speechRecognition.stop();
            } else {
                speechRecognition.lang = getLanguageCode(languageSelect.value);
                speechRecognition.start();
            }
        }

        function getLanguageCode(lang) {
            const codes = {
                'en': 'en-US',
                'hi': 'hi-IN',
                'ta': 'ta-IN',
                'te': 'te-IN',
                'mr': 'mr-IN',
                'bn': 'bn-IN',
                'gu': 'gu-IN',
                'pa': 'pa-IN',
                'kn': 'kn-IN',
                'ml': 'ml-IN',
                'ur': 'ur-PK',
            };
            return codes[lang] || 'en-US';
        }

        function speakText(text, lang = 'en') {
            if (!('speechSynthesis' in window)) {
                console.warn('Speech synthesis not supported');
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = getLanguageCode(lang);
            utterance.rate = 0.95;

            utterance.onstart = () => {
                isSpeaking = true;
                avatar.classList.add('speaking');
                setStatusIndicator('processing');
                ttsBtn.textContent = '⏸ Stop';
            };

            utterance.onend = () => {
                isSpeaking = false;
                avatar.classList.remove('speaking');
                setStatusIndicator('idle');
                ttsBtn.textContent = '🔊 Speak Response';
            };

            window.speechSynthesis.speak(utterance);
        }

        function toggleTTS() {
            if (!lastAssistantMessage) return;

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                avatar.classList.remove('speaking');
                setStatusIndicator('idle');
                ttsBtn.textContent = '🔊 Speak Response';
            } else {
                speakText(lastAssistantMessage, languageSelect.value);
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', () => {
            const message = inputEl.value.trim();
            if (message) sendMessage(message);
        });

        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const message = inputEl.value.trim();
                if (message) sendMessage(message);
            }
        });

        userSelect.addEventListener('change', updateSamplesForRole);
        languageSelect.addEventListener('change', () => {
            if (speechRecognition) {
                speechRecognition.lang = getLanguageCode(languageSelect.value);
            }
        });

        voiceBtn.addEventListener('click', toggleVoiceInput);
        ttsBtn.addEventListener('click', toggleTTS);

        // Initialize
        updateSamplesForRole();
        initSpeechRecognition();
    </script>
</body>
</html>
