<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ AI School Assistant</title>
    <style>
        :root {
            --bg1: #eef7ff;
            --bg2: #f5f3ff;
            --card: rgba(255, 255, 255, 0.78);
            --card-strong: #ffffff;
            --primary: #4f46e5;
            --primary-2: #7c3aed;
            --accent: #14b8a6;
            --text: #111827;
            --muted: #6b7280;
            --line: rgba(148, 163, 184, 0.35);
            --user: linear-gradient(135deg, #dbeafe, #bfdbfe);
            --assistant: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top left, rgba(79, 70, 229, 0.12), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(20, 184, 166, 0.12), transparent 30%),
                        linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
            border-radius: 26px;
            box-shadow: 0 25px 60px rgba(79, 70, 229, 0.12);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0f172a, #1e293b 45%, #312e81);
            color: white;
            padding: 22px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-mark {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #60a5fa, #8b5cf6);
            font-size: 1.5rem;
            box-shadow: 0 12px 24px rgba(96, 165, 250, 0.35);
        }

        .header h1 {
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2.1rem);
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls select,
        .controls input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .controls select:hover,
        .controls input:hover {
            border-color: rgba(255,255,255,0.3);
        }

        .controls select option {
            color: #111827;
        }

        .main {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            min-height: 660px;
        }

        .chat-panel {
            padding: 22px 22px 18px;
            border-right: 1px solid var(--line);
            background: rgba(248, 250, 252, 0.6);
            display: flex;
            flex-direction: column;
        }

        .avatar-panel {
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, rgba(79,70,229,0.06), rgba(20,184,166,0.08));
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 18px;
        }

        .avatar {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            position: relative;
            box-shadow: 0 12px 26px rgba(79,70,229,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .avatar.listening {
            animation: pulse-ring 1.5s infinite;
        }

        .avatar.speaking {
            animation: pulse-ring 0.6s infinite;
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 12px 26px rgba(79,70,229,0.25);
            }
            50% {
                box-shadow: 0 12px 26px rgba(79,70,229,0.5), 0 0 0 10px rgba(79,70,229,0.1);
            }
            100% {
                box-shadow: 0 12px 26px rgba(79,70,229,0.25);
            }
        }

        .avatar-status {
            flex: 1;
        }

        .avatar-status small {
            color: var(--muted);
            display: block;
            margin-bottom: 3px;
        }

        .avatar-status strong {
            font-size: 1.05rem;
        }

        .online {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--success);
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16,185,129,0.2);
            border-radius: 999px;
            padding: 5px 8px;
            margin-top: 5px;
        }

        .online::before {
            content: "";
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25% { opacity: 0.3; }
        }

        .messages {
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--line);
            border-radius: 18px;
            height: 440px;
            overflow-y: auto;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: inset 0 1px 8px rgba(148,163,184,0.10);
            flex: 1;
        }

        .message {
            margin: 10px 0;
            max-width: 82%;
            padding: 12px 15px;
            border-radius: 18px;
            line-height: 1.55;
            font-size: 0.97rem;
            box-shadow: 0 8px 18px rgba(15,23,42,0.04);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: var(--user);
            margin-left: auto;
            border-bottom-right-radius: 6px;
        }

        .message.assistant {
            background: var(--assistant);
            margin-right: auto;
            border-bottom-left-radius: 6px;
        }

        .message.system {
            background: rgba(248, 112, 112, 0.1);
            border: 1px solid rgba(248, 112, 112, 0.2);
            margin-right: 0;
            margin-left: 0;
            font-style: italic;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(148,163,184,0.45);
            font-size: 1rem;
            background: white;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-row input:focus {
            border-color: rgba(79,70,229,0.6);
            box-shadow: 0 0 0 4px rgba(79,70,229,0.12);
        }

        .input-row input:disabled {
            background: #f3f4f6;
            cursor: not-allowed;
        }

        .input-row button {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(79,70,229,0.24);
            transition: transform 0.2s ease;
            min-width: 80px;
        }

        .input-row button:hover {
            transform: translateY(-2px);
        }

        .input-row button:active {
            transform: translateY(0);
        }

        .input-row button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .sidebar {
            padding: 22px;
            background: rgba(255,255,255,0.3);
            overflow-y: auto;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel {
            background: rgba(255,255,255,0.82);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 12px 18px rgba(15, 23, 42, 0.04);
        }

        .panel h3 {
            margin: 0 0 12px;
            font-size: 1.06rem;
            font-weight: 600;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .metric {
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            border: 1px solid rgba(99, 102, 241, 0.14);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .metric small {
            color: var(--muted);
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
        }

        .metric strong {
            font-size: 1.2rem;
            display: block;
        }

        .sample {
            display: block;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
            border: 1px solid rgba(96,165,250,0.22);
            border-radius: 12px;
            padding: 10px 12px;
            margin: 10px 0;
            cursor: pointer;
            color: var(--text);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            font-size: 0.9rem;
            text-align: left;
        }

        .sample:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(59,130,246,0.08);
            border-color: rgba(96,165,250,0.4);
        }

        .sample:active {
            transform: translateY(0);
        }

        .interaction-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .voice-btn, .tts-btn, .escalate-btn {
            background: linear-gradient(135deg, var(--success), #0ea5a4);
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 12px 22px rgba(16, 185, 129, 0.18);
            transition: transform 0.2s ease;
            font-size: 0.95rem;
        }

        .escalate-btn {
            background: linear-gradient(135deg, var(--warning), var(--danger));
            box-shadow: 0 12px 22px rgba(248, 112, 112, 0.18);
        }

        .voice-btn:hover, .tts-btn:hover, .escalate-btn:hover {
            transform: translateY(-2px);
        }

        .voice-btn:active, .tts-btn:active, .escalate-btn:active {
            transform: translateY(0);
        }

        .voice-btn:disabled, .tts-btn:disabled, .escalate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--muted);
            margin-left: 8px;
        }

        .status-indicator.idle {
            background: var(--success);
        }

        .status-indicator.listening {
            background: var(--warning);
            animation: pulse 1s infinite;
        }

        .status-indicator.processing {
            background: var(--primary);
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            animation: fadeIn 0.3s ease-out;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(79, 70, 229, 0.2);
            max-width: 500px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            margin: 0 0 12px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-message {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.6;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            font-size: 0.95rem;
        }

        .modal-buttons button:hover {
            transform: translateY(-2px);
        }

        .modal-buttons button:active {
            transform: translateY(0);
        }

        .btn-confirm {
            background: linear-gradient(135deg, var(--success), #0ea5a4);
            color: white;
        }

        .btn-cancel {
            background: linear-gradient(135deg, var(--muted), #9ca3af);
            color: white;
        }

        @media (max-width: 760px) {
            .main {
                grid-template-columns: 1fr;
            }

            .chat-panel {
                border-right: none;
                border-bottom: 1px solid var(--line);
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .container {
                margin: 20px 12px;
                border-radius: 18px;
            }

            .sidebar {
                max-height: 400px;
                gap: 12px;
            }

            .messages {
                height: 300px;
            }

            .metric small {
                font-size: 0.75rem;
            }

            .metric strong {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <div class="brand-mark">🤖</div>
                <h1>XYZ AI School Assistant</h1>
            </div>
            <div class="controls">
                <select id="languageSelect" title="Select language">
                    <option value="en">🌐 English</option>
                    <option value="hi">हिन्दी</option>
                    <option value="ta">தமிழ்</option>
                    <option value="te">తెలుగు</option>
                    <option value="mr">मराठी</option>
                    <option value="bn">বাংলা</option>
                    <option value="gu">ગુજરાતી</option>
                    <option value="pa">ਪੰਜਾਬੀ</option>
                    <option value="kn">ಕನ್ನಡ</option>
                    <option value="ml">മലയാളം</option>
                    <option value="ur">اردو</option>
                </select>
                <select id="userSelect" title="Select user">
                    <option value="S001">👤 Rahul (Student)</option>
                    <option value="P001">👨‍👩‍👧 Priya (Parent)</option>
                    <option value="T001">👩‍🏫 Anita (Teacher)</option>
                    <option value="PR001">🎓 Raj (Principal)</option>
                </select>
            </div>
        </div>

        <div class="main">
            <div class="chat-panel">
                <div class="avatar-panel">
                    <div class="avatar" id="avatar" aria-label="AI avatar">🤖</div>
                    <div class="avatar-status">
                        <small>XYZ AI</small>
                        <strong>School Support Assistant</strong>
                        <span class="online">Online<span class="status-indicator idle" id="statusIndicator"></span></span>
                    </div>
                </div>

                <div id="messages" class="messages"></div>
                <div class="input-row">
                    <input id="messageInput" type="text" placeholder="Ask about attendance, support, or teacher escalation..." title="Type your message here" />
                    <button id="sendBtn" title="Send message">Send</button>
                </div>
            </div>

            <aside class="sidebar">
                <div class="panel">
                    <h3>📝 Quick Samples</h3>
                    <div id="samplesContainer"></div>
                </div>

                <div class="panel">
                    <h3>📊 School Status</h3>
                    <div class="metrics">
                        <div class="metric">
                            <small>Attendance</small>
                            <strong>89.7%</strong>
                        </div>
                        <div class="metric">
                            <small>Students</small>
                            <strong>1,240</strong>
                        </div>
                        <div class="metric">
                            <small>Parents</small>
                            <strong>980</strong>
                        </div>
                        <div class="metric">
                            <small>Teachers</small>
                            <strong>68</strong>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3>🎙️ Interaction</h3>
                    <div class="interaction-buttons">
                        <button id="voiceBtn" class="voice-btn" title="Click to speak to AI">🎤 Speak to AI</button>
                        <button id="ttsBtn" class="tts-btn" title="Speak last response" disabled>🔊 Speak Response</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Escalation Confirmation Modal -->
    <div id="escalationModal" class="modal">
        <div class="modal-content">
            <h2 id="escalationTitle" class="modal-title">Confirm Escalation</h2>
            <p id="escalationMessage" class="modal-message">Are you sure you want to escalate this request?</p>
            <div class="modal-buttons">
                <button class="btn-confirm" id="confirmEscalation">Yes, Proceed</button>
                <button class="btn-cancel" id="cancelEscalation">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // DOM elements
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const userSelect = document.getElementById('userSelect');
        const languageSelect = document.getElementById('languageSelect');
        const voiceBtn = document.getElementById('voiceBtn');
        const ttsBtn = document.getElementById('ttsBtn');
        const avatar = document.getElementById('avatar');
        const statusIndicator = document.getElementById('statusIndicator');
        const escalationModal = document.getElementById('escalationModal');
        const samplesContainer = document.getElementById('samplesContainer');

        // State
        let history = [];
        let lastAssistantMessage = '';
        let currentUserRole = '';
        let isListening = false;
        let isSpeaking = false;
        let speechRecognitionInstance = null;

        // Role-based quick samples
        const samplesByRole = {
            student: [
                { text: 'What is my attendance?', icon: '📊' },
                { text: 'Show my attendance.', icon: '📋' },
                { text: 'Am I maintaining good attendance?', icon: '✅' },
                { text: 'I want to talk to my teacher.', icon: '📞' },
            ],
            parent: [
                { text: 'How much attendance does my child have?', icon: '👨‍👩‍👧' },
                { text: 'What about last month?', icon: '📅' },
                { text: 'I want to talk to my child\'s teacher.', icon: '📞' },
                { text: 'Contact school management.', icon: '🏫' },
            ],
            teacher: [
                { text: 'Mark Rahul absent today.', icon: '✏️' },
                { text: 'Show Rahul\'s attendance.', icon: '📊' },
                { text: 'Which students have low attendance?', icon: '⚠️' },
            ],
            principal: [
                { text: 'What is the overall attendance?', icon: '📈' },
                { text: 'Which class has the lowest attendance?', icon: '📊' },
                { text: 'How many students are below 75%?', icon: '❓' },
                { text: 'Show today\'s attendance summary.', icon: '📋' },
            ],
        };

        // Utility functions
        function getCurrentUserRole() {
            const userId = userSelect.value;
            if (userId.startsWith('S')) return 'student';
            if (userId.startsWith('P')) return 'parent';
            if (userId.startsWith('T')) return 'teacher';
            if (userId.startsWith('PR')) return 'principal';
            return 'student';
        }

        function updateSamplesForRole() {
            currentUserRole = getCurrentUserRole();
            samplesContainer.innerHTML = '';
            const samples = samplesByRole[currentUserRole] || samplesByRole.student;
            samples.forEach(sample => {
                const span = document.createElement('span');
                span.className = 'sample';
                span.textContent = `${sample.icon} ${sample.text}`;
                span.title = sample.text;
                span.addEventListener('click', () => sendMessage(sample.text));
                samplesContainer.appendChild(span);
            });
        }

        function addMessage(text, sender = 'assistant') {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.textContent = text;
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            if (sender === 'assistant') {
                lastAssistantMessage = text;
                ttsBtn.disabled = false;
            }
        }

        function setStatusIndicator(status) {
            statusIndicator.className = `status-indicator ${status}`;
        }

        async function sendMessage(message) {
            if (!message.trim()) return;

            const userId = userSelect.value;
            const language = languageSelect.value;

            addMessage(message, 'user');
            history.push({ role: 'user', text: message });
            inputEl.value = '';
            inputEl.disabled = true;
            sendBtn.disabled = true;

            setStatusIndicator('processing');
            avatar.classList.add('speaking');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        message,
                        history,
                        language
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const responseText = data.text || 'I am here to help.';
                addMessage(responseText, 'assistant');
                history.push({ role: 'assistant', text: responseText });

                setStatusIndicator('idle');
                avatar.classList.remove('speaking');
            } catch (err) {
                console.error('Chat error:', err);
                addMessage('I could not reach the AI service. Please check your connection and try again.', 'assistant');
                setStatusIndicator('idle');
                avatar.classList.remove('speaking');
            } finally {
                inputEl.disabled = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        function showEscalationConfirmation(target, message) {
            const title = document.getElementById('escalationTitle');
            const msgEl = document.getElementById('escalationMessage');
            const confirmBtn = document.getElementById('confirmEscalation');

            title.textContent = `Escalate to ${target === 'teacher' ? 'Teacher' : 'Management'}?`;
            msgEl.textContent = message || `Confirm escalation to ${target}`;
            confirmBtn.textContent = 'Yes, Escalate';

            escalationModal.classList.add('show');

            confirmBtn.onclick = () => {
                escalationModal.classList.remove('show');
                addMessage('Escalation request submitted successfully.', 'system');
            };
        }

        // Event listeners
        sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(inputEl.value);
            }
        });

        userSelect.addEventListener('change', () => {
            updateSamplesForRole();
            inputEl.focus();
        });

        languageSelect.addEventListener('change', (e) => {
            const lang = e.target.value;
            if (speechRecognitionInstance) {
                const langMap = {
                    'en': 'en-US',
                    'hi': 'hi-IN',
                    'ta': 'ta-IN',
                    'te': 'te-IN',
                    'mr': 'mr-IN',
                    'bn': 'bn-IN',
                    'gu': 'gu-IN',
                    'pa': 'pa-IN',
                    'kn': 'kn-IN',
                    'ml': 'ml-IN',
                    'ur': 'ur-IN',
                };
                speechRecognitionInstance.lang = langMap[lang] || 'en-US';
            }
        });

        document.getElementById('cancelEscalation').addEventListener('click', () => {
            escalationModal.classList.remove('show');
        });

        escalationModal.addEventListener('click', (e) => {
            if (e.target === escalationModal) {
                escalationModal.classList.remove('show');
            }
        });

        // Voice Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            speechRecognitionInstance = new SpeechRecognition();
            speechRecognitionInstance.lang = 'en-US';
            speechRecognitionInstance.continuous = false;
            speechRecognitionInstance.interimResults = false;

            speechRecognitionInstance.onstart = () => {
                isListening = true;
                voiceBtn.textContent = '🎙️ Listening...';
                voiceBtn.style.opacity = '0.7';
                setStatusIndicator('listening');
                avatar.classList.add('listening');
            };

            speechRecognitionInstance.onresult = (event) => {
                const transcript = Array.from(event.results)
                    .map(result => result[0].transcript)
                    .join('');
                inputEl.value = transcript;
                isListening = false;
                voiceBtn.textContent = '🎤 Speak to AI';
                voiceBtn.style.opacity = '1';
                setStatusIndicator('processing');
                avatar.classList.remove('listening');
                sendMessage(transcript);
            };

            speechRecognitionInstance.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                isListening = false;
                voiceBtn.textContent = '🎤 Speak to AI';
                voiceBtn.style.opacity = '1';
                setStatusIndicator('idle');
                avatar.classList.remove('listening');
                if (event.error !== 'no-speech') {
                    addMessage(`Voice input error: ${event.error}`, 'system');
                }
            };

            speechRecognitionInstance.onend = () => {
                isListening = false;
                voiceBtn.textContent = '🎤 Speak to AI';
                voiceBtn.style.opacity = '1';
                avatar.classList.remove('listening');
            };

            voiceBtn.addEventListener('click', () => {
                if (!isListening) {
                    try {
                        speechRecognitionInstance.start();
                    } catch (e) {
                        console.error('Could not start speech recognition:', e);
                    }
                }
            });
        } else {
            voiceBtn.disabled = true;
            voiceBtn.textContent = '🎤 Not Supported';
            voiceBtn.title = 'Speech recognition not supported in this browser';
        }

        // Text-to-Speech Setup
        ttsBtn.addEventListener('click', () => {
            if (!lastAssistantMessage) return;

            const utterance = new SpeechSynthesisUtterance(lastAssistantMessage);
            const language = languageSelect.value;

            const langMap = {
                'en': 'en-US',
                'hi': 'hi-IN',
                'ta': 'ta-IN',
                'te': 'te-IN',
                'mr': 'mr-IN',
                'bn': 'bn-IN',
                'gu': 'gu-IN',
                'pa': 'pa-IN',
                'kn': 'kn-IN',
                'ml': 'ml-IN',
                'ur': 'ur-IN',
            };

            utterance.lang = langMap[language] || 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1;

            utterance.onstart = () => {
                isSpeaking = true;
                ttsBtn.textContent = '🔊 Speaking...';
                ttsBtn.style.opacity = '0.7';
                setStatusIndicator('processing');
                avatar.classList.add('speaking');
            };

            utterance.onend = () => {
                isSpeaking = false;
                ttsBtn.textContent = '🔊 Speak Response';
                ttsBtn.style.opacity = '1';
                setStatusIndicator('idle');
                avatar.classList.remove('speaking');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        });

        // Initialize
        updateSamplesForRole();
        addMessage('Hello! I am XYZ AI, your school assistant. How may I help you today?', 'assistant');
        setStatusIndicator('idle');
        inputEl.focus();
    </script>
</body>
</html>
